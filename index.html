<!DOCTYPE html>
<html lang="ja">
<head>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-MML-AM_CHTML">
</script>
  <meta charset="UTF-8">
  <title>双曲放物面 $z = x² - y²$</title>
  <!-- Plotly.js の読み込み -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <!-- MathJax (LaTeXレンダリング用) の読み込み -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #plot { width: 90vw; height: 90vh; }
  </style>
</head>
<body>

<div id="plot"></div>

<script>
  const size = 50;
  const x = [], y = [], z = [];
  const range = 2;

  for (let i = 0; i < size; i++) {
    x[i] = -range + (2 * range * i) / (size - 1);
    y[i] = -range + (2 * range * i) / (size - 1);
  }

  for (let i = 0; i < size; i++) {
    z[i] = [];
    for (let j = 0; j < size; j++) {
      z[i][j] = Math.pow(x[j], 2) - Math.pow(y[i], 2);
    }
  }

  const data = [{
    z: z,
    x: x,
    y: y,
    type: 'surface',
    colorscale: 'Viridis'
  }];

  const layout = {
    // TeX表記を指定（MathJaxによりLaTeXフォントで描画されます）
    title: { text: '双曲放物面 $z = x^2 - y^2$' },
    autosize: true,
    scene: {
      xaxis: { title: { text: '<i>x</i>' } },
      yaxis: { title: { text: '<i>y</i>' } },
      zaxis: { title: { text: '<i>z</i>' } }
    }
  };

  Plotly.newPlot('plot', data, layout);
</script>

</body>
</html>
